syntax = "proto3";

package io.finmsg.dmn;

option java_package = "io.finmsg.dmn.model";
option java_multiple_files = true;
option java_outer_classname = "FeelTextProtos";

import "types.proto";

//
// ============================================================================
// FEEL Text Model
// ============================================================================
//
// Represents FEEL text and DMN boxed expressions exactly as read from XML.
// This model has no dependency on the parsed FEEL model.
//

message FeelText {
  string text = 1;
}

message ExpressionText {
  oneof type {
    FeelText feel = 1;
    BoxedExpressionText boxed = 2;
  }
}

message BoxedExpressionText {
  oneof type {
    ContextText context = 1;
    RelationText relation = 2;
    ListExpressionText list = 3;
    FunctionDefinitionText function_definition = 4;
  }
}

message ContextText {
  repeated ContextEntryText entries = 1;
}

message ContextEntryText {
  InformationItem variable = 1;
  ExpressionText expression = 2;
}

message RelationText {
  repeated RelationColumnText columns = 1;
  repeated RelationRowText rows = 2;
}

message RelationColumnText {
  InformationItem variable = 1;
}

message RelationRowText {
  repeated ExpressionText expressions = 1;
}

message ListExpressionText {
  repeated ExpressionText elements = 1;
}

message FunctionDefinitionText {
  repeated InformationItem parameters = 1;
  ExpressionText body = 2;
}
