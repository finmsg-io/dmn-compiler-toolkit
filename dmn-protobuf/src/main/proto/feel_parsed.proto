syntax = "proto3";

package io.finmsg.dmn;

option java_package = "io.finmsg.dmn.model";
option java_multiple_files = true;
option java_outer_classname = "FeelParsedProtos";

import "types.proto";

//
// ============================================================================
// Parsed FEEL Model
// ============================================================================
//
// Represents parsed FEEL expressions and parsed DMN boxed expressions.
// This model has no dependency on the FEEL text model.
//

message FeelParsed {
  Expression ast = 1;
}

message ExpressionParsed {
  oneof type {
    FeelParsed feel = 1;
    BoxedExpressionParsed boxed = 2;
  }
}

message BoxedExpressionParsed {
  oneof type {
    ContextParsed context = 1;
    RelationParsed relation = 2;
    ListExpressionParsed list = 3;
    FunctionDefinitionParsed function_definition = 4;
  }
}

message ContextParsed {
  repeated ContextEntryParsed entries = 1;
}

message ContextEntryParsed {
  InformationItem variable = 1;
  ExpressionParsed expression = 2;
}

message RelationParsed {
  repeated RelationColumnParsed columns = 1;
  repeated RelationRowParsed rows = 2;
}

message RelationColumnParsed {
  InformationItem variable = 1;
}

message RelationRowParsed {
  repeated ExpressionParsed expressions = 1;
}

message ListExpressionParsed {
  repeated ExpressionParsed elements = 1;
}

message FunctionDefinitionParsed {
  repeated InformationItem parameters = 1;
  ExpressionParsed body = 2;
}

//
// ============================================================================
// FEEL Abstract Syntax Tree
// ============================================================================

message Expression {
  oneof node {
    LiteralExpression literal = 1;
    NameExpression name = 2;
    UnaryExpression unary = 3;
    BinaryExpression binary = 4;
    FunctionCall function_call = 5;
    IfExpression if_expression = 6;
    ContextExpression context = 7;
    ListExpression list = 8;
    ForExpression for_expression = 9;
    QuantifiedExpression quantified = 10;
    FilterExpression filter = 11;
    PathExpression path = 12;
    InvocationExpression invocation = 13;
    DecisionTableExpression decision_table = 14;
    RangeExpression range = 15;
    BetweenExpression between = 16;
    InExpression in = 17;
    InstanceOfExpression instance_of = 18;
    DescendantExpression descendant = 19;
    FunctionDefinitionExpression function_definition = 20;
    UnaryTestsExpression unary_tests = 21;
  }

  TypeReference inferred_type = 100;
}

message LiteralExpression {
  LiteralKind kind = 1;
  string value = 2;
}

enum LiteralKind {
  LITERAL_KIND_UNSPECIFIED = 0;
  LITERAL_KIND_NULL = 1;
  LITERAL_KIND_BOOLEAN = 2;
  LITERAL_KIND_NUMBER = 3;
  LITERAL_KIND_STRING = 4;
  LITERAL_KIND_DATE = 5;
  LITERAL_KIND_TIME = 6;
  LITERAL_KIND_DATE_TIME = 7;
  LITERAL_KIND_DURATION = 8;
}

message NameExpression {
  string name = 1;
}

message UnaryExpression {
  UnaryOperator operator = 1;
  Expression expression = 2;
}

enum UnaryOperator {
  UNARY_OPERATOR_UNSPECIFIED = 0;
  UNARY_OPERATOR_PLUS = 1;
  UNARY_OPERATOR_MINUS = 2;
  UNARY_OPERATOR_NOT = 3;
}

message BinaryExpression {
  BinaryOperator operator = 1;
  Expression left = 2;
  Expression right = 3;
}

enum BinaryOperator {
  BINARY_OPERATOR_UNSPECIFIED = 0;
  BINARY_OPERATOR_ADD = 1;
  BINARY_OPERATOR_SUBTRACT = 2;
  BINARY_OPERATOR_MULTIPLY = 3;
  BINARY_OPERATOR_DIVIDE = 4;
  BINARY_OPERATOR_POWER = 5;
  BINARY_OPERATOR_EQUAL = 6;
  BINARY_OPERATOR_NOT_EQUAL = 7;
  BINARY_OPERATOR_LESS = 8;
  BINARY_OPERATOR_LESS_EQUAL = 9;
  BINARY_OPERATOR_GREATER = 10;
  BINARY_OPERATOR_GREATER_EQUAL = 11;
  BINARY_OPERATOR_AND = 12;
  BINARY_OPERATOR_OR = 13;
}

message FunctionCall {
  string function = 1;
  repeated Expression arguments = 2;
}

message IfExpression {
  Expression condition = 1;
  Expression then_expression = 2;
  Expression else_expression = 3;
}

message ContextExpression {
  repeated ContextEntry entries = 1;
}

message ContextEntry {
  string name = 1;
  Expression expression = 2;
}

message ListExpression {
  repeated Expression elements = 1;
}

message ForExpression {
  //
  // Legacy single-binding representation.
  //
  // New AST builders must populate iterations instead.
  //
  string variable = 1;
  Expression in = 2;
  Expression return_expression = 3;

  repeated IterationContext iterations = 4;
}

message QuantifiedExpression {
  Quantifier quantifier = 1;
  //
  // Legacy single-binding representation.
  //
  // New AST builders must populate bindings instead.
  //
  string variable = 2;
  Expression in = 3;
  Expression satisfies = 4;

  repeated IterationBinding bindings = 5;
}

message IterationContext {
  string variable = 1;
  Expression start = 2;
  //
  // Present for the FEEL iteration form:
  //
  //   for x in 1..10 return x
  //
  Expression end = 3;
}

message IterationBinding {
  string variable = 1;
  Expression in = 2;
}

enum Quantifier {
  QUANTIFIER_UNSPECIFIED = 0;
  QUANTIFIER_SOME = 1;
  QUANTIFIER_EVERY = 2;
}

message FilterExpression {
  Expression source = 1;
  Expression filter = 2;
}

message PathExpression {
  Expression source = 1;
  string member = 2;
}

message InvocationExpression {
  Expression target = 1;
  repeated NamedArgument arguments = 2;
  repeated Expression positional_arguments = 3;
}

message NamedArgument {
  string name = 1;
  Expression expression = 2;
}

message DecisionTableExpression {
  string decision_table_id = 1;
}

//
// ============================================================================
// Additional FEEL expression nodes
// ============================================================================

message RangeExpression {
  //
  // Missing lower or upper messages represent an unbounded range.
  //
  Expression lower = 1;
  Expression upper = 2;
  RangeBoundary lower_boundary = 3;
  RangeBoundary upper_boundary = 4;
}

enum RangeBoundary {
  RANGE_BOUNDARY_UNSPECIFIED = 0;
  RANGE_BOUNDARY_OPEN = 1;
  RANGE_BOUNDARY_CLOSED = 2;
}

message BetweenExpression {
  Expression value = 1;
  Expression lower = 2;
  Expression upper = 3;
}

message InExpression {
  Expression value = 1;
  UnaryTestsExpression tests = 2;
}

message InstanceOfExpression {
  Expression expression = 1;
  FeelType type = 2;
}

message DescendantExpression {
  Expression source = 1;
  string member = 2;
}

message FunctionDefinitionExpression {
  repeated FormalParameter parameters = 1;
  Expression body = 2;
  bool external = 3;
}

message FormalParameter {
  string name = 1;
  FeelType type = 2;
}

//
// ============================================================================
// Parsed unary tests
// ============================================================================

message UnaryTestParsed {
  UnaryTestsExpression tests = 1;
}

message UnaryTestsExpression {
  //
  // true for:
  //
  //   not(< 10, [20..30])
  //
  bool negated = 1;

  //
  // true for the wildcard unary test:
  //
  //   -
  //
  bool wildcard = 2;

  repeated PositiveUnaryTest tests = 3;
}

message PositiveUnaryTest {
  oneof type {
    ComparisonUnaryTest comparison = 1;
    RangeExpression range = 2;
    Expression expression = 3;
  }
}

message ComparisonUnaryTest {
  UnaryTestOperator operator = 1;
  Expression endpoint = 2;
}

enum UnaryTestOperator {
  UNARY_TEST_OPERATOR_UNSPECIFIED = 0;
  UNARY_TEST_OPERATOR_EQUAL = 1;
  UNARY_TEST_OPERATOR_NOT_EQUAL = 2;
  UNARY_TEST_OPERATOR_LESS = 3;
  UNARY_TEST_OPERATOR_LESS_EQUAL = 4;
  UNARY_TEST_OPERATOR_GREATER = 5;
  UNARY_TEST_OPERATOR_GREATER_EQUAL = 6;
}

//
// ============================================================================
// Parsed FEEL types
// ============================================================================
//
// This is the syntactic FEEL type representation used by "instance of" and
// typed function parameters. TypeReference remains the semantic/resolved type.
//

message FeelType {
  oneof type {
    string qualified_name = 1;
    RangeType range = 2;
    ListType list = 3;
    ContextType context = 4;
    FunctionType function = 5;
  }
}

message RangeType {
  FeelType element_type = 1;
}

message ListType {
  FeelType element_type = 1;
}

message ContextType {
  repeated ContextTypeEntry entries = 1;
}

message ContextTypeEntry {
  string name = 1;
  FeelType type = 2;
}

message FunctionType {
  repeated FeelType parameter_types = 1;
  FeelType return_type = 2;
}
