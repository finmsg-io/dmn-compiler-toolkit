syntax = "proto3";

package io.finmsg.dmn;

option java_package = "io.finmsg.dmn.model";
option java_multiple_files = true;
option java_outer_classname = "FeelProtos";

import "feel_text.proto";
import "feel_parsed.proto";

//
// ============================================================================
// Replaceable FEEL Nodes
// ============================================================================
//
// The XML frontend creates the text representation.
// The FEEL parser replaces it with the parsed representation.
//

message Feel {
  oneof representation {
    FeelText text = 1;
    FeelParsed parsed = 2;
  }
}

message ExpressionNode {
  oneof representation {
    ExpressionText text = 1;
    ExpressionParsed parsed = 2;
  }
}

message BoxedExpression {
  oneof representation {
    BoxedExpressionText text = 1;
    BoxedExpressionParsed parsed = 2;
  }
}
