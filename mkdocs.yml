          - Runtime Assessment: audits/assessment-implementation-dmn-runtime.md
          - Compiler Assessment: audits/assessment-implementation-dmn-compiler.md
          - Module Architecture Assessment: audits/assessment-module-architecture.md
          - Architecture by Module:
              - Protobuf: audits/assessment-architecture-dmn-protobuf.md
              - XML Frontend: audits/assessment-architecture-dmn-frontend-xml.md
              - FEEL Parser: audits/assessment-architecture-dmn-feel-parser.md
              - Semantic Analysis: audits/assessment-architecture-dmn-semantic-analysis.md
              - Runtime IR: audits/assessment-architecture-dmn-runtime-ir.md
              - Runtime: audits/assessment-architecture-dmn-runtime.md
              - Compiler: audits/assessment-architecture-dmn-compiler.md
      - Style Guide: dev/style.md
      - Evidence-Backed Spec-Driven Development: dev/evidence-backed-spec-driven-development.md
      - CI and Publishing: ci-and-publishing.md
  - Roadmap: roadmap.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
