name: Feature Request
description: Suggest an idea or new capability for the DMN Compiler Toolkit.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new feature!
  - type: textarea
    id: use-case
    attributes:
      label: Problem / Use Case
      description: What problem does this feature solve, or what use case does it enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: A clear description of your proposed API, compiler pass, or backend solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds considered.
