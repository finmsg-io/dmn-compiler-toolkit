name: Maven CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python for repository checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Select verification scope
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci_impact.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify canonical documentation facts
        run: python tools/verify_documentation.py

      - name: Verify repository tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Set up JDK 25
        if: steps.impact.outputs.heavy == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify reactor, formatting and complete optimized TCK once
        if: steps.impact.outputs.heavy == 'true'
        run: mvn --batch-mode -Pformat,tck -Dtck.backend=all -Dtck.requireFull=true -Dtck.timeoutSeconds=30 verify

      - name: Verify tracked sources remain unchanged
        run: git diff --check && git diff --exit-code

      - name: Upload JaCoCo coverage reports
        if: always() && steps.impact.outputs.heavy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.run_number }}
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

      - name: Upload optimized TCK accounting
        if: always() && steps.impact.outputs.heavy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: optimized-tck-accounting-${{ github.run_number }}
          path: dmn-tck-runner/target/tck-accounting-optimized*.json
          if-no-files-found: error
