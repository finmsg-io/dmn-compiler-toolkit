name: Maven CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Pull request: build and test only
      - name: Verify pull request
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode verify

      # Feature branch push: publish branch-specific SNAPSHOT
      - name: Set feature SNAPSHOT version
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          mvn --batch-mode versions:set \
            -DnewVersion="1.0.0-${BRANCH}-SNAPSHOT" \
            -DgenerateBackupPoms=false

      - name: Publish feature SNAPSHOT
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merge into main: convert 1.0.0-SNAPSHOT to 1.0.0 and publish
      - name: Set release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mvn --batch-mode versions:set \
            -DremoveSnapshot \
            -DgenerateBackupPoms=false

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}