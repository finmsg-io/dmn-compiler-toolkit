name: Maven CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Pull requests and main pushes: verify build and run tests
      - name: Verify build and test
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
        run: mvn --batch-mode verify

      # Tagged release push (e.g. v1.0.0): deploy release version to GitHub Packages
      - name: Extract tag version and set release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${TAG_NAME}"
          mvn --batch-mode versions:set \
            -DnewVersion="${TAG_NAME}" \
            -DgenerateBackupPoms=false

      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}