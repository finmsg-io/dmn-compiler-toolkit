name: Maven CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Python for documentation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify canonical documentation facts
        run: python tools/verify_documentation.py

      - name: Verify repository tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Build documentation strictly
        run: mkdocs build --strict

      # Fail fast before the reactor spends time compiling and testing modules.
      - name: Verify source formatting
        run: mvn --batch-mode -Pformat spotless:check

      # Pull requests and main pushes: verify build and run tests
      - name: Verify build and test
        run: mvn --batch-mode verify

      # Catch generators or build steps that rewrite tracked files differently by OS.
      - name: Verify tracked sources remain unchanged
        run: git diff --check && git diff --exit-code

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.run_number }}
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

      - name: Print TCK test summary
        if: always()
        run: |
          echo "=== TCK Surefire Test Summary ==="
          find . -path "*/surefire-reports/*.xml" -name "*.xml" \
            | xargs grep -h 'tests=' 2>/dev/null \
            | grep -oP '(?<=tests=")[0-9]+' \
            | awk '{s+=$1} END {print "Total tests executed: " s}'
