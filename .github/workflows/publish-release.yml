name: Publish Maven release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to retry after a pre-publication failure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.authority.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up pinned Maven 3.9.12
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo "0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"

      - name: Report pinned Maven version
        run: mvn --version

      - name: Set up Python for release validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify tag, Maven version, and main ancestry
        id: authority
        shell: bash
        run: |
          python tools/verify_release.py --tag "$RELEASE_TAG"
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify canonical documentation facts
        run: python tools/verify_documentation.py

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Clean release and complete optimized TCK verification once
        run: mvn --batch-mode -Pformat,release,tck -Dtck.backend=all -Dtck.requireFull=true clean verify

      - name: Generate release notes and artifact checksums
        run: |
          python tools/generate_release_notes.py --tag "$RELEASE_TAG" --output release-notes.md
          python tools/generate_checksums.py --output checksums.sha256
          python tools/generate_checksums.py --verify checksums.sha256

      - name: Verify release artifacts and clean checkout
        run: |
          python tools/verify_release.py --tag "$RELEASE_TAG" --artifacts
          git diff --check
          git diff --exit-code

  publish-release:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25 and Sonatype Central publication credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Set up pinned Maven 3.9.12
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo "0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"

      - name: Report pinned Maven version
        run: mvn --version

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Reconfirm immutable publication authority
        shell: bash
        run: |
          python tools/verify_release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "${{ needs.verify-release.outputs.commit }}"

      - name: Publish immutable Maven artifacts to Central Portal
        id: upload
        shell: bash
        run: |
          mvn --batch-mode -Prelease -Dgpg.skip=false -DskipTests deploy | tee "$RUNNER_TEMP/central-upload.log"
          python - <<'PY'
          import os, re, uuid
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "central-upload.log").read_text()
          matches = re.findall(r"deploymentId:\s*([0-9a-fA-F-]{36})", log)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one Central deployment ID")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("deployment_id=" + str(uuid.UUID(matches[0])) + "\n")
          PY

      - name: Require completed Central publication
        shell: bash
        env:
          CENTRAL_DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
          CENTRAL_REQUIRE_PUBLISHED: "true"
          RELEASE_TOOLING_REVISION: ${{ github.workflow_sha }}
        run: |
          git show "$RELEASE_TOOLING_REVISION:tools/central_status.py" > "$RUNNER_TEMP/central_status.py"
          for attempt in {1..30}; do
            set +e
            python "$RUNNER_TEMP/central_status.py"
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then exit 0; fi
            if [ "$result" -ne 3 ]; then exit "$result"; fi
            sleep 30
          done
          echo "Central did not confirm PUBLISHED within the polling window" >&2
          exit 1
