name: Inspect Central deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Existing Central Portal deployment UUID (read-only status)
        required: true
        type: string

      bundle_paths:
        description: Optional JSON list of relative artifact paths to inspect (contents are not logged)
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Report runner Maven version
        run: mvn --version
      - name: Read deployment validation status
        env:
          CENTRAL_BUNDLE_PATHS: ${{ inputs.bundle_paths }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: python tools/central_status.py
