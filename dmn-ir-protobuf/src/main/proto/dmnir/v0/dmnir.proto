syntax = "proto3";

package io.finmsg.dmn.dmnir.v0;

option java_package = "io.finmsg.dmn.dmnir.proto.v0";
option java_multiple_files = true;
option java_outer_classname = "DmnIrProtos";

// Experimental profiles 0.0 through 0.3 of ADR-0026. Not a stable v1 wire contract.
// No semantic-protobuf imports, FEEL source, original XML or second logic graph.
// Parsing these messages does NOT validate an executable model. A bounded verifier
// must check versions, capabilities, declarations, types, references and ordering.
message DmnIrArtifact {
  DmnIrSchemaVersion schema_version = 1;
  string semantics_version = 2;
  repeated string required_capabilities = 3;
  string root_model_namespace = 4;
  repeated DmnIrModel models = 5;
  // Resolved decision identities, in validated dependency order across models.
  // This is a derived schedule, not a second representation of decision logic.
  repeated DmnIrReference evaluation_order = 6;
}

message DmnIrSchemaVersion {
  // Explicit presence distinguishes experimental major zero from a missing version.
  optional uint32 major = 1;
  optional uint32 minor = 2;
}

message DmnIrModel {
  DmnIrElementIdentity identity = 1;
  // The business model namespace, NOT the DMN standard's XML vocabulary URI.
  string namespace = 2;
  repeated DmnIrImport imports = 3;
  repeated DmnIrInput inputs = 4;
  repeated DmnIrDecision decisions = 5;
  repeated DmnIrRecordDefinition record_definitions = 6;
}

message DmnIrElementIdentity {
  string id = 1;
  string name = 2;
}

message DmnIrImport {
  // References a bundled model; no external source retrieval is required.
  string model_namespace = 1;
  // Local import alias, distinct from the imported model's display name.
  string name = 2;
  // Optional interchange hint; never an executable loading instruction.
  optional string location_uri = 3;
}

message DmnIrVariable {
  // DMN information-item identity may differ from its owning DRG element.
  optional string id = 1;
  string name = 2;
  DmnIrScalarType type = 3;
  // Schema 0.2: exactly one of a supported scalar type or record_type.
  DmnIrReference record_type = 4;
}

message DmnIrInput {
  DmnIrElementIdentity identity = 1;
  DmnIrVariable variable = 2;
}

message DmnIrDecision {
  DmnIrElementIdentity identity = 1;
  DmnIrVariable variable = 2;
  repeated DmnIrReference dependencies = 3;
  DmnIrExpression expression = 4;
}

message DmnIrReference {
  // Fully resolved identity, independent of source aliases and execution slots.
  string model_namespace = 1;
  string element_id = 2;
}

enum DmnIrScalarType {
  SCALAR_TYPE_UNSPECIFIED = 0;
  SCALAR_TYPE_NULL = 1;
  SCALAR_TYPE_BOOLEAN = 2;
  SCALAR_TYPE_NUMBER = 3;
  SCALAR_TYPE_STRING = 4;
}

message DmnIrExpression {
  DmnIrScalarType type = 1;
  // Schema 0.2: mutually exclusive with a supported scalar type.
  DmnIrReference record_type = 7;
  // Other structured operations arrive in later slices. An unset/unknown node
  // must be rejected by the verifier, never treated as an implicit null literal.
  oneof node {
    DmnIrLiteral literal = 2;
    DmnIrReference global_reference = 3;
    // These nodes require schema 0.1 and dmnir.scalar-expressions.
    DmnIrUnaryExpression unary = 4;
    DmnIrBinaryExpression binary = 5;
    DmnIrConditionalExpression conditional = 6;
    DmnIrFieldAccess field_access = 8;
    DmnIrLocalReference local_reference = 9;
    DmnIrContextExpression context = 10;
  }
}

message DmnIrTypeReference {
  oneof kind {
    DmnIrScalarType scalar_type = 1;
    DmnIrReference record_type = 2;
  }
}

message DmnIrRecordDefinition {
  DmnIrElementIdentity identity = 1;
  repeated DmnIrRecordField fields = 2;
}

message DmnIrRecordField {
  optional string id = 1;
  string name = 2;
  DmnIrTypeReference type = 3;
}

message DmnIrFieldAccess {
  DmnIrExpression source = 1;
  string field_name = 2;
}

// Binding IDs are decision-local identities, never runtime frame/slot addresses.
message DmnIrLocalReference {
  string binding_id = 1;
}
message DmnIrLocalBinding {
  string binding_id = 1;
  DmnIrVariable variable = 2;
  DmnIrExpression value = 3;
}
message DmnIrContextExpression {
  repeated DmnIrLocalBinding bindings = 1;
  DmnIrExpression result = 2;
}

message DmnIrUnaryExpression {
  DmnIrUnaryOperator operator = 1;
  DmnIrExpression operand = 2;
}

message DmnIrBinaryExpression {
  DmnIrBinaryOperator operator = 1;
  DmnIrExpression left = 2;
  DmnIrExpression right = 3;
}

message DmnIrConditionalExpression {
  DmnIrExpression condition = 1;
  DmnIrExpression then_expression = 2;
  DmnIrExpression else_expression = 3;
}

// Numeric identities are portable contracts, never Java enum ordinals.
enum DmnIrUnaryOperator {
  UNARY_OPERATOR_UNSPECIFIED = 0;
  UNARY_OPERATOR_POSITIVE = 1;
  UNARY_OPERATOR_NEGATE = 2;
  UNARY_OPERATOR_NOT = 3;
}

enum DmnIrBinaryOperator {
  BINARY_OPERATOR_UNSPECIFIED = 0;
  BINARY_OPERATOR_ADD = 1;
  BINARY_OPERATOR_SUBTRACT = 2;
  BINARY_OPERATOR_MULTIPLY = 3;
  BINARY_OPERATOR_DIVIDE = 4;
  BINARY_OPERATOR_POWER = 5;
  BINARY_OPERATOR_EQUAL = 6;
  BINARY_OPERATOR_NOT_EQUAL = 7;
  BINARY_OPERATOR_LESS = 8;
  BINARY_OPERATOR_LESS_EQUAL = 9;
  BINARY_OPERATOR_GREATER = 10;
  BINARY_OPERATOR_GREATER_EQUAL = 11;
  BINARY_OPERATOR_AND = 12;
  BINARY_OPERATOR_OR = 13;
}

message DmnIrLiteral {
  // Oneof presence preserves explicit null, false, empty string and numeric zero.
  oneof value {
    DmnIrNull null_value = 1;
    bool boolean_value = 2;
    string string_value = 3;
    DmnIrDecimal number_value = 4;
  }
}

enum DmnIrNull {
  NULL_VALUE = 0;
}

message DmnIrDecimal {
  // Exact value = unscaled_value * 10^(-scale), without binary floating point.
  // Integer grammar: 0|-?[1-9][0-9]* (ASCII); no plus, leading zeros or negative zero.
  // Preserve trailing coefficient zeros and signed scale: numeric equality does
  // not imply byte identity. Canonical content hashing is a separate contract.
  string unscaled_value = 1;
  // Presence is mandatory even for zero. Resource limits are verifier policy;
  // consumers must bound coefficient length and scale before numeric expansion.
  optional sint32 scale = 2;
}
